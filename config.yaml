# ─────────────────────────────────────────────────────────────
#  DnD News 설정 파일
#  이 파일만 고치면 신문 이름, 출처, 분량, 모델을 바꿀 수 있습니다.
# ─────────────────────────────────────────────────────────────

site:
  name: "DnD News"
  tagline: "AI · 투자 · 돈의 흐름"
  url: "https://news.example.com"      # 실제 도메인으로 교체
  timezone: "Asia/Seoul"

edition:
  articles: 20              # 조간에 실을 기사 수 (중요도 순)
  candidates: 30            # 검증 탈락을 대비해 초안을 쓰는 후보 수
  lookback_hours: 26        # 몇 시간 전 기사까지 모을지
  min_outlets: 2            # 교차검증: 서로 다른 언론사 최소 개수
  max_foreign: 6            # 해외(영문) 보도 최대 게재 수
  hold_until: null          # "06:00" 으로 두면 완성 후 06:00(KST)까지 기다렸다가 공개

models:
  cluster: "claude-sonnet-5"             # 기사 묶기·중요도 판단
  writer: "claude-sonnet-5"              # 기사 작성
  factcheck: "claude-sonnet-5"           # 사실 확인
  breaking: "claude-haiku-4-5-20251001"  # 속보 제목 번역·분류

breaking:
  keep_hours: 48            # 속보란에 남겨둘 시간
  lookback_minutes: 180

# 섹션 정의 (id는 영문, 이름은 화면 표시용)
sections:
  - { id: ai,     name: "AI·테크" }
  - { id: kr,     name: "국내 증시" }
  - { id: global, name: "해외 증시" }
  - { id: money,  name: "돈의 흐름" }
  - { id: crypto, name: "암호화폐" }
  - { id: people, name: "인물" }

# 속보란에서 인물 태그를 붙일 이름 (한글, 영문 모두)
people:
  - [트럼프, Trump]
  - [파월, Powell]
  - [이재명, "Lee Jae-myung"]
  - [시진핑, "Xi Jinping"]
  - [머스크, Musk]
  - [젠슨 황, 젠슨황, "Jensen Huang"]
  - [샘 올트먼, 올트먼, Altman]
  - [이재용, "Lee Jae-yong"]
  - [버핏, Buffett]
  - [베선트, Bessent]
  - [이창용, "Rhee Chang-yong"]
  - [저커버그, Zuckerberg]

